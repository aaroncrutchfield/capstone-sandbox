<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lantern Settings Screen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Inter:wght@400;500&display=swap">
<style>
  /* Layout: one phone-width settings card, a heading, three switch rows with helper text, a save bar. */
  :root { --bg: #eef2f6; --card: #ffffff; --fg: #17202b; --muted: #5a6778; --line: #d6dde6; --accent: #1f6feb; --on: #1f6feb; --off: #b8c2cf;
    --display: "Space Grotesk", system-ui, sans-serif; --body: Inter, system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f141a; --card: #171e27; --fg: #e6ebf1; --muted: #9aa7b7; --line: #2a3440; --accent: #6ea8ff; --on: #6ea8ff; --off: #3a4554; color-scheme: dark } }
  :root[data-theme="dark"] { --bg: #0f141a; --card: #171e27; --fg: #e6ebf1; --muted: #9aa7b7; --line: #2a3440; --accent: #6ea8ff; --on: #6ea8ff; --off: #3a4554; color-scheme: dark }
  body { background: var(--bg); color: var(--fg); font-family: var(--body); padding-block: 2rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  main { max-width: 24rem; margin-inline: auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  header { padding: 1.25rem 1.25rem .75rem; }
  h1 { font-family: var(--display); font-size: 1.5rem; margin: 0; text-wrap: balance; }
  header p { margin: .25rem 0 0; color: var(--muted); font-size: .875rem; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 1rem; align-items: center; justify-content: space-between; padding: .9rem 1.25rem; border-top: 1px solid var(--line); }
  li div { min-width: 0; }
  li strong { display: block; font-weight: 500; }
  li span { display: block; color: var(--muted); font-size: .8125rem; margin-top: .15rem; }
  .switch { flex: none; width: 2.75rem; height: 1.5rem; border-radius: 999px; background: var(--off); position: relative; }
  .switch::after { content: ""; position: absolute; top: .1875rem; left: .1875rem; width: 1.125rem; height: 1.125rem; border-radius: 50%; background: var(--card); }
  .switch.on { background: var(--on); }
  .switch.on::after { left: 1.4375rem; }
  footer { padding: 1rem 1.25rem; border-top: 1px solid var(--line); }
  button { width: 100%; font: 500 1rem var(--body); color: #fff; background: var(--accent); border: 0; border-radius: 10px; padding: .75rem; }
</style>
<main>
  <header>
    <h1>Harbor Lantern Settings</h1>
    <p>Choose how the lantern app behaves on this phone.</p>
  </header>
  <ul>
    <li><div><strong>Notifications</strong><span>Alerts when a tide warning is issued</span></div><i class="switch on" aria-label="On"></i></li>
    <li><div><strong>Sync over cellular</strong><span>Uses mobile data when Wi-Fi is off</span></div><i class="switch" aria-label="Off"></i></li>
    <li><div><strong>Dark mode</strong><span>Follows the phone unless set here</span></div><i class="switch" aria-label="Off"></i></li>
  </ul>
  <footer><button type="button">Save settings</button></footer>
</main>

</body></html>
