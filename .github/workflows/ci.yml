name: ci
on:
  pull_request:
    branches: [main, 'milestone/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test
      - name: sitting switch
        if: vars.DEMO4_CI_FAIL == '1'
        run: |
          echo "sitting-switch: DEMO4_CI_FAIL is on; the M4 sitting holds CI red until the owner turns it off"
          exit 1
