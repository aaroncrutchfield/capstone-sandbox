<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Harbor Lantern Settings</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Inter:wght@400;500&display=swap">
  <style>
    :root {
      --bg: #eef2f6; --card: #ffffff; --fg: #17202b; --muted: #5a6778; --line: #d6dde6;
      --accent: #1f6feb; --on: #1f6feb; --off: #b8c2cf;
      --display: "Space Grotesk", system-ui, sans-serif; --body: Inter, system-ui, sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #0f141a; --card: #171e27; --fg: #e6ebf1; --muted: #9aa7b7; --line: #2a3440; --accent: #6ea8ff; --on: #6ea8ff; --off: #3a4554; color-scheme: dark }
    }
    :root[data-theme="dark"] { --bg: #0f141a; --card: #171e27; --fg: #e6ebf1; --muted: #9aa7b7; --line: #2a3440; --accent: #6ea8ff; --on: #6ea8ff; --off: #3a4554; color-scheme: dark }
    body {
      margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body);
      padding-block: 2rem;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }
    main { max-width: 24rem; margin-inline: auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    header { padding: 1.25rem 1.25rem .75rem; }
    h1 { font-family: var(--display); font-weight: 600; font-size: 1.5rem; margin: 0; text-wrap: balance; }
    header p { margin: .25rem 0 0; color: var(--muted); font-size: .875rem; }
    ul { list-style: none; margin: 0; padding: 0; }
    li label { display: flex; gap: 1rem; align-items: center; justify-content: space-between; padding: .9rem 1.25rem; border-top: 1px solid var(--line); cursor: pointer; }
    li strong { display: block; font-weight: 500; }
    .help { display: block; color: var(--muted); font-size: .8125rem; margin-top: .15rem; }
    .switch { position: relative; flex: none; width: 2.75rem; height: 1.5rem; }
    .switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
    .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--off); pointer-events: none; }
    .switch span::after { content: ""; position: absolute; top: .1875rem; left: .1875rem; width: 1.125rem; height: 1.125rem; border-radius: 50%; background: var(--card); transition: left .15s; }
    .switch input:checked + span { background: var(--on); }
    .switch input:checked + span::after { left: 1.4375rem; }
    .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
    footer { padding: 1rem 1.25rem; border-top: 1px solid var(--line); }
    button { display: block; width: 100%; font: 500 1rem var(--body); color: #fff; background: var(--accent); border: 0; border-radius: 10px; padding: .75rem; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Harbor Lantern Settings</h1>
      <p>Choose how the lantern app behaves on this phone.</p>
    </header>
    <ul>
      <li>
        <label>
          <span><strong>Notifications</strong><span class="help">Alerts when a tide warning is issued</span></span>
          <span class="switch"><input type="checkbox" role="switch" name="notifications" checked><span></span></span>
        </label>
      </li>
      <li>
        <label>
          <span><strong>Sync over cellular</strong><span class="help">Uses mobile data when Wi-Fi is off</span></span>
          <span class="switch"><input type="checkbox" role="switch" name="sync"><span></span></span>
        </label>
      </li>
      <li>
        <label>
          <span><strong>Dark mode</strong><span class="help">Follows the phone unless set here</span></span>
          <span class="switch"><input type="checkbox" role="switch" name="dark"><span></span></span>
        </label>
      </li>
    </ul>
    <footer>
      <button type="button">Save settings</button>
    </footer>
  </main>
</body>
</html>
